$kind: http-request
url: "{{base}}/users/{{userId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Has userId', () => pm.expect(pm.response.json().userId).to.be.a('string'));
    language: text/javascript
order: 1000
