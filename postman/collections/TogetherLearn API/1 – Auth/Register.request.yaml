$kind: http-request
url: "{{base}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Test Student",
      "email": "en202001@foe.sjp.ac.lk",
      "password": "password123",
      "department": "CO",
      "batch": "Batch 5",
      "registrationNumber": "EN202001",
      "indexNumber": "20/ENG/001"
    }
scripts:
  - type: afterResponse
    code: |-
      const r = pm.response.json();
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.test('Has token', () => pm.expect(r.token).to.be.a('string'));
      pm.collectionVariables.set('token', r.token);
      pm.collectionVariables.set('userId', r.userId);
    language: text/javascript
order: 1000
