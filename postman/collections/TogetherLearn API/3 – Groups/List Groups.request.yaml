$kind: http-request
url: "{{base}}/groups"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Is array', () => pm.expect(pm.response.json()).to.be.an('array'));
    language: text/javascript
order: 2000
