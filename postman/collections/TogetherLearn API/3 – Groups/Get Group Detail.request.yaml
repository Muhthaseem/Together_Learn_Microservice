$kind: http-request
url: "{{base}}/groups/{{groupId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Has groupId', () => pm.expect(pm.response.json().groupId).to.be.a('string'));
    language: text/javascript
order: 3000
