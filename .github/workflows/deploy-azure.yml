name: Deploy to Azure AKS

on:
  push:
    branches: [deploy/azure-aks]

env:
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/togetherlearn
  RESOURCE_GROUP: togetherlearn-rg
  CLUSTER_NAME: togetherlearn-aks
  NAMESPACE: togetherlearn

jobs:
  # ── Build & push all backend service images ───────────────────────────────
  build-push-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - discovery-server
          - api-gateway
          - user-service
          - course-service
          - group-service
          - qa-service
          - peer-teaching-service
          - notification-service
          - chat-service
          - file-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build JAR
        working-directory: services
        run: mvn -B package -DskipTests -pl ${{ matrix.service }} --also-make -q

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: services
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-to: type=inline

  # ── Build & push frontend image ───────────────────────────────────────────
  build-push-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-to: type=inline

  # ── Deploy to Azure AKS ───────────────────────────────────────────────────
  deploy:
    needs: [build-push-services, build-push-frontend]
    runs-on: ubuntu-latest
    environment: azure-production
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Create namespace if not exists
        run: kubectl apply -f k8s/namespace.yaml

      - name: Apply secrets and configmaps
        run: |
          kubectl apply -f k8s/secrets/
          kubectl apply -f k8s/configmaps/

      - name: Apply Azure storage class
        run: kubectl apply -f k8s/azure/storage-class.yaml

      - name: Apply stateful infrastructure
        run: kubectl apply -f k8s/stateful/

      - name: Wait for databases to be ready
        run: |
          for db in postgres-user postgres-course postgres-group postgres-qa postgres-peer postgres-notification postgres-chat; do
            kubectl rollout status statefulset/$db -n ${{ env.NAMESPACE }} --timeout=300s
          done

      - name: Apply monitoring stack
        run: kubectl apply -f k8s/monitoring/

      - name: Apply application deployments
        run: kubectl apply -f k8s/deployments/

      - name: Apply HPA and ingress
        run: |
          kubectl apply -f k8s/hpa/
          kubectl apply -f k8s/ingress/

      - name: Roll out new images
        env:
          SHA: ${{ github.sha }}
        run: |
          SERVICES=(
            discovery-server api-gateway user-service course-service
            group-service qa-service peer-teaching-service
            notification-service chat-service file-service frontend
          )
          for svc in "${SERVICES[@]}"; do
            kubectl set image deployment/$svc \
              $svc=${{ env.IMAGE_PREFIX }}-$svc:$SHA \
              -n ${{ env.NAMESPACE }}
          done

      - name: Wait for all rollouts
        run: |
          DEPLOYMENTS=(
            discovery-server api-gateway user-service course-service
            group-service qa-service peer-teaching-service
            notification-service chat-service file-service frontend
          )
          for dep in "${DEPLOYMENTS[@]}"; do
            kubectl rollout status deployment/$dep \
              -n ${{ env.NAMESPACE }} --timeout=300s
          done

      - name: Show running pods
        run: kubectl get pods -n ${{ env.NAMESPACE }}
