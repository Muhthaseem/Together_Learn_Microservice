name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # ── Build all Spring Boot services (parallel matrix) ────────────────────────
  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - api-gateway
          - user-service
          - course-service
          - group-service
          - qa-service
          - peer-teaching-service
          - notification-service
          - chat-service
          - file-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('services/pom.xml', 'services/${{ matrix.service }}/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Build JAR (skip tests)
        run: mvn -B package -DskipTests -pl ${{ matrix.service }} --also-make
        working-directory: services

  # ── Build Next.js frontend ───────────────────────────────────────────────────
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check and build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api
