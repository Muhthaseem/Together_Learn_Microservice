name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/togetherlearn

jobs:
  # ── Build & push all Spring Boot service images (parallel matrix) ────────────
  build-push-services:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - api-gateway
          - user-service
          - course-service
          - group-service
          - qa-service
          - peer-teaching-service
          - notification-service
          - chat-service
          - file-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('services/pom.xml', 'services/${{ matrix.service }}/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Build JAR
        run: mvn -B package -DskipTests -pl ${{ matrix.service }} --also-make
        working-directory: services

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:buildcache,mode=max

  # ── Build & push Next.js frontend image ─────────────────────────────────────
  build-push-frontend:
    name: Build & push frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-frontend:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-frontend:buildcache,mode=max

  # ── Rolling deploy to Kubernetes ─────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build-push-services, build-push-frontend]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Apply namespace, secrets, configmaps, and stateful sets
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secrets/
          kubectl apply -f k8s/configmaps/
          kubectl apply -f k8s/stateful/
          kubectl apply -f k8s/monitoring/

      - name: Apply deployments, HPAs, and Ingress
        run: |
          kubectl apply -f k8s/deployments/
          kubectl apply -f k8s/hpa/
          kubectl apply -f k8s/ingress/

      - name: Roll out updated service images
        run: |
          SHA=${{ github.sha }}
          PREFIX=${{ env.IMAGE_PREFIX }}

          services=(
            "discovery-server"
            "api-gateway"
            "user-service"
            "course-service"
            "group-service"
            "qa-service"
            "peer-teaching-service"
            "notification-service"
            "chat-service"
            "file-service"
          )

          for svc in "${services[@]}"; do
            kubectl set image deployment/$svc \
              $svc=${PREFIX}-${svc}:${SHA} \
              -n togetherlearn
          done

          kubectl set image deployment/frontend \
            frontend=${PREFIX}-frontend:${SHA} \
            -n togetherlearn

      - name: Wait for rollouts to complete
        run: |
          deployments=(
            discovery-server api-gateway
            user-service course-service group-service
            qa-service peer-teaching-service notification-service
            chat-service file-service frontend
          )

          for dep in "${deployments[@]}"; do
            echo "Waiting for $dep..."
            kubectl rollout status deployment/$dep -n togetherlearn --timeout=300s
          done

      - name: Verify all pods are running
        run: kubectl get pods -n togetherlearn
