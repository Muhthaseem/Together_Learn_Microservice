# NOTE: NEXT_PUBLIC_API_URL is a Next.js build-time variable.
# Build the image with: docker build --build-arg NEXT_PUBLIC_API_URL=https://api.togetherlearn.app/api
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: togetherlearn
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: togetherlearn/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: togetherlearn
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
